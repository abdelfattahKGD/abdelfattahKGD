name: Generate Profile Assets
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. توليد الثعبان
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 2. توليد كارت الإحصائيات (Stats)
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&bg_color=111827&title_color=00f5d4&icon_color=7b2cbf&text_color=c9d1d9&border_radius=14
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. توليد كارت اللغات (Top Languages)
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=111827&title_color=00f5d4&text_color=c9d1d9&border_radius=14
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. رفع كل الصور لفرع output
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
